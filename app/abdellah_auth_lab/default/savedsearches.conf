[LAB - Historical detection (synthetic)]
search = index=lab_windows_auth sourcetype="lab:windows:auth:json" synthetic=true run_id="lab-auth-20261008" (EventCode=4624 OR EventCode=4625) | eval EventCode=tonumber(EventCode), LogonType=tonumber(LogonType), target_user=lower(TargetUserName), target_domain=lower(TargetDomainName) | where isnotnull(Computer) AND isnotnull(target_user) AND isnotnull(target_domain) AND isnotnull(SourceIp) AND SourceIp!="" AND SourceIp!="-" AND isnotnull(LogonType) | dedup run_id Computer EventRecordID | sort 0 +_time +EventRecordID | streamstats current=f time_window=5m count(eval(EventCode=4625)) AS failures_before_success min(eval(if(EventCode=4625,_time,null()))) AS first_failure BY run_id Computer target_domain target_user SourceIp LogonType | where EventCode=4624 AND failures_before_success>=5 | eval success_epoch=_time, window_seconds=round(_time-first_failure,0), detection_id=run_id.":".Computer.":".EventRecordID | table _time first_failure Computer TargetDomainName TargetUserName SourceIp LogonType failures_before_success window_seconds EventRecordID detection_id scenario_id run_id
enableSched = 0
dispatch.earliest_time = 0
dispatch.latest_time = now

[LAB - Live synthetic alert]
description = Disabled by default. Six generated JSON events test scheduling; no Windows logons are performed.
search = index=lab_windows_auth sourcetype="lab:windows:auth:json" synthetic=true run_id="lab-auth-live-*" (EventCode=4624 OR EventCode=4625) | eval EventCode=tonumber(EventCode), LogonType=tonumber(LogonType), target_user=lower(TargetUserName), target_domain=lower(TargetDomainName) | where isnotnull(Computer) AND isnotnull(target_user) AND isnotnull(target_domain) AND isnotnull(SourceIp) AND SourceIp!="" AND SourceIp!="-" AND isnotnull(LogonType) | dedup run_id Computer EventRecordID | sort 0 +_time +EventRecordID | streamstats current=f time_window=5m count(eval(EventCode=4625)) AS failures_before_success min(eval(if(EventCode=4625,_time,null()))) AS first_failure BY run_id Computer target_domain target_user SourceIp LogonType | where EventCode=4624 AND failures_before_success>=5 | eval success_epoch=_time, window_seconds=round(_time-first_failure,0), detection_id=run_id.":".Computer.":".EventRecordID | where success_epoch>=relative_time(now(),"-2m@m") AND success_epoch<relative_time(now(),"-1m@m") | table _time first_failure Computer TargetDomainName TargetUserName SourceIp LogonType failures_before_success window_seconds EventRecordID detection_id scenario_id run_id
disabled = 1
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -7m@m
dispatch.latest_time = -1m@m
counttype = number of events
relation = greater than
quantity = 0
alert.track = true
alert.digest_mode = false
alert.expires = 24h
alert.suppress = 1
alert.suppress.period = 10m
alert.suppress.fields = detection_id
