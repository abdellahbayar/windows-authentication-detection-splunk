<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authentication Lab - Synthetic Data Preview</title>
<style>
:root{--bg:#0b111c;--panel:#121d2d;--line:#26354a;--muted:#91a5be;--text:#edf4fd;--blue:#62b7ff;--green:#53d9a6;--red:#ff8e86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:18px/1.5 'Segoe UI',Arial,sans-serif}a{color:var(--blue)}button,input{font:inherit}button{cursor:pointer;background:#15273e;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 16px}button:hover,button.active{color:var(--blue);border-color:var(--blue)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 36px;border-bottom:1px solid var(--line)}header strong{font-size:26px}header span{font-size:16px;color:var(--muted)}.notice{background:#162d40;color:#bdddff;padding:12px 36px;border-bottom:1px solid #3b6384;font-size:17px}.layout{display:grid;grid-template-columns:228px 1fr;min-height:790px}aside{border-right:1px solid var(--line);padding:22px 16px}aside button{display:block;width:100%;text-align:left;margin-bottom:10px;border-color:transparent;background:transparent;font-size:17px}main{padding:28px 34px 42px}h1{font-size:33px;line-height:1.15;margin:0 0 10px;letter-spacing:-.6px}h2{font-size:22px;margin:0 0 16px}p{margin:8px 0 18px}.muted{color:var(--muted)}.badge{display:inline-block;border:1px solid #305272;color:var(--blue);border-radius:99px;padding:4px 12px;font-size:14px}.grid{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.kpi{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.kpi b{display:block;font-size:45px;line-height:1.2;color:var(--blue)}.kpi span{font-size:16px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:16px}th{text-align:left;color:var(--muted);font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.4px}td,th{padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}td.good,.good{color:var(--green)}td.bad,.bad{color:var(--red)}code,pre{font:15px/1.65 Consolas,monospace}pre{margin:0;padding:19px;border-radius:11px;background:#080f18;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;max-height:355px;color:#bddcf8}.wide{grid-column:1/-1}.flow{display:flex;align-items:center;gap:15px;margin:40px 0}.node{flex:1;min-height:175px;padding:24px;background:var(--panel);border:1px solid #385777;border-radius:18px}.node b{font-size:25px;display:block;color:var(--blue)}.arrow{color:var(--blue);font-size:32px}.node p{font-size:17px}.terminal{background:#050b10;color:#bde5d1;min-height:260px;font-size:18px;line-height:1.8}.split{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:24px 0 14px}input{background:#0b1524;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:white;width:340px}.keyval{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.keyval div{padding:10px 0;border-bottom:1px solid var(--line)}.keyval span{font-size:15px;display:block;color:var(--muted)}.keyval b{font-size:19px;font-weight:500}.callout{border-left:3px solid var(--blue);padding:16px 20px;background:#122337;border-radius:0 12px 12px 0;margin:22px 0}.small{font-size:15px}.foot{position:fixed;bottom:0;left:228px;right:0;background:#0b111cf0;border-top:1px solid var(--line);padding:9px 36px;color:var(--muted);font-size:13px}.chart{width:100%;height:240px}.status{color:var(--green)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:flex;flex-wrap:wrap;gap:7px;border-right:0}aside button{width:auto}.foot{left:0}.grid,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.flow{flex-direction:column}.node{width:100%}.arrow{transform:rotate(90deg)}main{padding:20px}.toolbar{flex-wrap:wrap}table{font-size:12px}td,th{padding:8px 4px}}
.layout{min-height:0}.foot{position:static;margin-left:228px}
@media(max-width:900px){header{flex-wrap:wrap;gap:8px;padding:18px 20px}.card{min-width:0;overflow-x:auto}table{table-layout:fixed;overflow-wrap:anywhere}.toolbar input{max-width:100%}main{padding-bottom:30px}.foot{padding:10px 20px;margin-left:0}}
</style></head><body><header><strong>Abdellah / Authentication Lab</strong><span>Windows-like events · Splunk learning project</span></header><div class="notice">SYNTHETIC DATA · Illustrative local preview · Not a live Splunk session</div><div class="layout"><aside id="nav"></aside><main id="main"></main></div><div class="foot">Fixture: lab-auth-20261008 · UTC timestamps · Expected results from the Python reference model</div>
<script>
const data=__PAYLOAD__;
const titles={architecture:'Architecture',install:'Installation',ingestion:'Ingestion',events:'Events',detection:'Detection',dashboard:'Dashboard',validation:'Validation',alert:'Alert',triage:'Triage'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(headers,rows)=>'<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
const card=(title,body)=>'<section class="card"><h2>'+title+'</h2>'+body+'</section>';
const eventRows=events=>events.map(e=>[e.timestamp.slice(11,19),e.EventCode,e.TargetUserName,e.SourceIp,e.LogonType,e.SubStatus,e.EventRecordID]);
const hitRows=data.hits.map(h=>[h.scenario_id,h.TargetUserName,h.SourceIp,h.LogonType,h.failures_before_success,h.window_seconds+' s',h.success_time.slice(11,19)]);
const kpis=()=>'<div class="kpis">'+[[55,'Synthetic events'],[46,'Failed logons'],[9,'Successful logons'],[2,'Expected matches']].map(([n,label])=>'<div class="kpi"><b>'+n+'</b><span>'+label+'</span></div>').join('')+'</div>';
function graph(){let svg='<svg class="chart" viewBox="0 0 1040 245" role="img" aria-label="Failures and successes by scenario">';for(let i=0;i<10;i++){let sid='S'+String(i+1).padStart(2,'0'),ev=data.events.filter(e=>e.scenario_id===sid),f=ev.filter(e=>e.EventCode===4625).length,s=ev.length-f,x=45+i*100;svg+=`<rect x="${x}" y="${190-f*27}" width="30" height="${f*27}" rx="4" fill="#ff8e86"/><rect x="${x+34}" y="${190-s*27}" width="30" height="${s*27}" rx="4" fill="#53d9a6"/><text x="${x+30}" y="218" text-anchor="middle" font-size="15" fill="#b1c0d6">${sid}</text>`;}return svg+'<text x="46" y="26" fill="#ff8e86" font-size="17">4625 / failures</text><text x="240" y="26" fill="#53d9a6" font-size="17">4624 / successes</text></svg>'}
function render(view){if(!titles[view])view='dashboard';document.getElementById('nav').innerHTML=Object.entries(titles).map(([k,t])=>`<button class="${k===view?'active':''}" onclick="render('${k}')">${t}</button>`).join('');let body='';
if(view==='architecture')body='<h1>From an event to a detection</h1><p class="muted">A reproducible synthetic workflow without performing authentication attempts.</p><div class="flow"><div class="node"><b>01 / Generator</b><p>generate_data.py<br>55 JSONL records<br>DESKTOP-N7PEBGK</p></div><div class="arrow">→</div><div class="node"><b>02 / Splunk</b><p>Server: soc-mail-lab<br>Index: lab_windows_auth<br>Normalized JSON parsing</p></div><div class="arrow">→</div><div class="node"><b>03 / Analysis</b><p>SPL search + dashboard<br>2 expected candidates<br>Scheduled test alert</p></div></div><div class="grid">'+card('Lab identities','<p>Target: <b>LabUser</b><br>Requester: <b>LabAdmin</b><br>Primary host: <b>DESKTOP-N7PEBGK</b></p>')+card('Data origin','<p>Generated events, not EVTX exports.<br>WIN-LAB-02: invented host.<br>::1: local source in the fixture.</p>')+'</div><div class="callout">Original Ubuntu captures record VM preparation. The illustrative figures show expected results for comparison after import.</div>';
if(view==='install')body='<h1>Prepare the Splunk server</h1><p class="muted">Commands for the Ubuntu VM; actual installation output remains to be checked.</p><div class="grid">'+card('Ubuntu / soc-mail-lab','<div class="keyval"><div><span>Observed RAM</span><b>7.8 GiB / 8 GB</b></div><div><span>Available CPUs</span><b>4</b></div><div><span>Architecture</span><b>x86_64</b></div><div><span>IP observed on 8 October</span><b>192.168.231.161</b></div></div>')+card('Splunk Enterprise','<p>Linux amd64 .deb package.<br>Linux service account: <b>splunk</b><br>Application account: created at first startup.<br>Splunk Web: <b>VM address : 8000</b></p>')+'</div><div style="margin-top:24px">'+card('Installation commands / reference','<pre class="terminal">sudo dpkg -i ./splunk-enterprise.deb\nsudo chown -R splunk:splunk /opt/splunk\nsudo -H -u splunk /opt/splunk/bin/splunk start</pre>')+'</div>';
if(view==='ingestion')body='<h1>Data ingestion check</h1><p class="muted">Fixed run: lab-auth-20261008 · All time · 55 distinct records expected</p>'+kpis()+'<div class="grid">'+card('Bundled configuration','<div class="keyval"><div><span>Index</span><b>lab_windows_auth</b></div><div><span>Sourcetype</span><b>lab:windows:auth:json</b></div><div><span>Input</span><b>monitor / data/*.jsonl</b></div><div><span>Format</span><b>Synthetic JSONL</b></div></div>')+card('Data quality / expected result',table(['events','failures','successes','record_ids'],[[55,46,9,55]])+'<p class="small muted" style="margin-top:20px">One JSON line = one event. Explicit UTC timestamps and search-time field extraction.</p>')+'</div><div class="callout">Do not ingest the same file through a second input. These totals come from the fixture; capture the actual Splunk search after installation.</div>';
if(view==='events')body='<h1>Read the event timeline</h1><p class="muted">TargetUserName ≠ SubjectUserName · 4625 failure / 4624 success</p><div class="toolbar"><input id="filter" placeholder="Filter by account, scenario or event…" oninput="filterEvents(this.value)"><button onclick="downloadCSV()">Download synthetic CSV</button></div><div class="card" id="event-table"></div><div class="callout">SubStatus 0xC000006A: incorrect password. 0xC0000064: unknown username. SubStatus is not applicable to successful logons.</div>';
if(view==='detection')body='<h1>5 failures → 1 success</h1><p class="muted">Rolling window: 300 seconds · preceding events · consistent correlation keys</p><div class="split">'+card('Search logic','<pre>'+esc(data.query)+'</pre>')+card('Expected result rows',table(['Case','Target','IP','Type','Failures','Window','Success UTC'],hitRows)+'<div class="callout">S01 and S08 only.<br>scenario_id is a test label, not a detection condition.</div><p class="small muted">Records are deduplicated and sorted before streamstats. The rule goes beyond an aggregate event count.</p>')+'</div>';
if(view==='dashboard')body='<h1>Windows Authentication / Overview</h1><p class="muted">Synthetic fixture · expected results, not real incidents</p>'+kpis()+card('Failures and successes by scenario',graph())+'<div style="margin-top:20px">'+card('Candidates for triage',table(['Case','Target','Source','Logon','Failures','Window','Success UTC'],hitRows))+'</div>';
if(view==='validation')body='<h1>A detection rule must also reject unrelated events</h1><p class="muted">10 known-outcome cases · negative tests for ordering, threshold and isolation</p>'+card('Expected-results matrix',table(['Case','Synthetic scenario','Expected','Python reference','Actual Splunk'],data.stats.scenarios.map(s=>[s.id,s.description,s.expected_alert?'1 match':'0 match',s.expected_alert?'1 match':'0 match','Pending'])))+'<div class="callout">Offline checks PASS: fixtures, threshold, duplicates, account case, missing keys and XML structure. Splunk runtime validation remains pending.</div>';
if(view==='alert')body='<h1>Scheduled alert / synthetic test</h1><p class="muted">LAB - Live synthetic alert · initially disabled in the package</p><div class="grid">'+card('Included settings','<div class="keyval"><div><span>Frequency</span><b>Every minute</b></div><div><span>Event search window</span><b>-7m@m → -1m@m</b></div><div><span>Condition</span><b>Results &gt; 0</b></div><div><span>Action</span><b>Triggered Alerts</b></div><div><span>Suppression</span><b>10m / detection_id</b></div><div><span>External notifications</span><b>None</b></div></div>')+card('Test with current timestamps','<p>1. Enable the alert after validation.<br>2. Generate six records within the last 2 minutes.<br>3. Copy the JSONL into the monitored input.<br>4. Inspect the job and Triggered Alerts.</p><span class="badge">RUNTIME VALIDATION PENDING</span>')+'</div><div style="margin-top:22px">'+card('Test fixture generator','<pre>python3 generate_data.py --live-positive authentication-live-01.jsonl</pre><p class="small muted">No Windows authentication is performed. Each test uses a new run_id.</p>')+'</div><div class="callout">The one-minute delay is a lab choice. Late-arriving events require appropriate scheduling and deduplication.</div>';
if(view==='triage')body='<h1>S01 / Evidence before interpretation</h1><p class="muted">DESKTOP-N7PEBGK · Target LabUser · Subject LabAdmin · all timestamps UTC</p>'+card('Six correlated synthetic events',table(['Time UTC','Event','Target','Source','Type','SubStatus','Record ID'],eventRows(data.events.filter(e=>e.scenario_id==='S01'))))+'<div class="grid" style="margin-top:20px">'+card('Observation','<p>Five failures, followed by success.<br>Interval: <b>100 seconds</b>.<br>The same correlation keys.</p>')+card('Interpretation and limitations','<p>A test or repeated typing errors are possible.<br>The fixture generator explains this case.<br><b>No compromise is established.</b></p>')+'</div>';
document.getElementById('main').innerHTML=body;if(view==='events')filterEvents('');window.currentView=view;}
function filterEvents(text){const rows=data.events.filter(e=>JSON.stringify(e).toLowerCase().includes(text.toLowerCase()));document.getElementById('event-table').innerHTML='<p class="small muted">'+rows.length+' filtered events · first 12 shown</p>'+table(['UTC','Event','Target','IP','Type','SubStatus','Record'],eventRows(rows.slice(0,12)));}
function downloadCSV(){const keys=Object.keys(data.events[0]),q=s=>'"'+String(s).replace(/"/g,'""')+'"',csv=[keys.map(q).join(','),...data.events.map(e=>keys.map(k=>q(e[k])).join(','))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='authentication-synthetic.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
render(new URL(location.href).searchParams.get('view')||'dashboard');
</script></body></html>
